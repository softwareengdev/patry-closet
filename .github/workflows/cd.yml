name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ─── Deploy Frontend to Cloudflare Pages ───
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: patry-closet-web/package-lock.json

      - name: Install & Build
        working-directory: patry-closet-web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=patrycloset --branch=main
          workingDirectory: patry-closet-web

  # ─── Deploy Backend ───
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Backend deployment triggered"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Image: ghcr.io/${{ github.repository }}/api:latest"
          echo ""
          echo "To deploy manually, pull the latest image:"
          echo "  docker pull ghcr.io/${{ github.repository }}/api:latest"
          echo "  docker compose -f patry-closet-server/docker-compose.prod.yml up -d"
