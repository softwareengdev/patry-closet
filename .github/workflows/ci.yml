name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ─── Backend CI ───
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patry-closet-server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: patrycloset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('patry-closet-server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore PatryCloset.sln

      - name: Build
        run: dotnet build PatryCloset.sln -c Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test tests/PatryCloset.UnitTests
          -c Release --no-build
          --logger "trx;LogFileName=unit-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=patrycloset_test;Username=postgres;Password=postgres"
          Jwt__Secret: "SuperSecretKeyForCITestingPurposesOnly_AtLeast32Characters!"
          Jwt__Issuer: "PatryCloset.Test"
          Jwt__Audience: "PatryCloset.Test"
          Stripe__SecretKey: "sk_test_fake"
          Stripe__WebhookSecret: "whsec_test_fake"
        run: >
          dotnet test tests/PatryCloset.IntegrationTests
          -c Release --no-build
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: patry-closet-server/TestResults/
          retention-days: 30

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: patry-closet-server/TestResults/**/coverage.cobertura.xml
          retention-days: 30

  # ─── Backend Docker Build ───
  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: patry-closet-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SKIP_TESTS=true
            BUILD_CONFIGURATION=Release

  # ─── Frontend CI ───
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patry-closet-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: patry-closet-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: patry-closet-web/dist/
          retention-days: 7
